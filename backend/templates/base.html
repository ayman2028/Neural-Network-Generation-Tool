
<!DOCTYPE html>


<html>
    <head>
        <meta charset = "utf-8">
        <title>Neural Network Generation Tool</title>
    </head>
    <body>
        <header style="background-color: #f5f5f5; padding: 10px; border-bottom: 1px solid #ddd; margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1><a href="{% url 'home' %}" style="text-decoration: none; color: inherit;">Neural Network Generation Tool</a></h1>
                <div>
                    {% if user.is_authenticated %}
                        <span>Welcome, {{ user.username }}!</span>
                        <form method="post" action="{% url 'logout' %}" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" style="margin-left: 10px;">Logout</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}">Log In</a>
                        <span> | </span>
                        <a href="{% url 'signup' %}">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </header>
        <main style="padding: 20px;">
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
